name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Ruff and prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-groups --all-extras --python 3.14
      - run: make lint

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-groups --all-extras --python 3.14
      - run: make mypy

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-groups --all-extras --python 3.14
      - run: make pyright

  slotscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --all-groups --all-extras --python 3.14
      - run: make slotscheck

  test_python:
    name: test (python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: ./.github/workflows/test.yml
    with:
      coverage: ${{ matrix.python-version == '3.14' }}
      python-version: ${{ matrix.python-version }}
      timeout: 60

  test_shuffle:
    name: test (python 3.14, shuffled)
    uses: ./.github/workflows/test.yml
    with:
      python-version: "3.14"
      shuffle: true
      timeout: 60

  codecov:
    needs: test_python
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-xml
          path: .

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cofin/litestar-security

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group docs --all-extras --python 3.14
      - run: make docs
      - run: make docs-linkcheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --group build --python 3.14
      - run: make build
      - name: Install and smoke-test wheel
        run: |
          uv venv --python 3.14 /tmp/litestar-security-smoke
          uv pip install --python /tmp/litestar-security-smoke/bin/python dist/*.whl
          /tmp/litestar-security-smoke/bin/python - <<'PY'
          from importlib.resources import files

          import litestar_security
          from litestar_security import SecurityConfig, SecurityPlugin

          assert litestar_security.__project__ == "litestar-security"
          assert SecurityConfig is not None
          assert SecurityPlugin is not None
          assert files("litestar_security").joinpath("py.typed").is_file()
          PY
          /tmp/litestar-security-smoke/bin/litestar security --help
          /tmp/litestar-security-smoke/bin/litestar security --version
