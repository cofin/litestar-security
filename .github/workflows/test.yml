name: Test

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      coverage:
        required: false
        type: boolean
        default: false
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout:
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    env:
      PYTHON_VERSION: ${{ inputs.python-version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install test dependencies
        run: uv sync --group tests --python "$PYTHON_VERSION"

      - name: Test
        if: ${{ !inputs.coverage }}
        run: make test

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: >-
          uv run pytest -m "not performance"
          --cov=litestar_security
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Build and smoke-test installed wheel
        run: |
          uv build --wheel --out-dir /tmp/litestar-security-dist
          uv venv --python "$PYTHON_VERSION" /tmp/litestar-security-wheel
          uv pip install --python /tmp/litestar-security-wheel/bin/python /tmp/litestar-security-dist/*.whl
          cd /tmp
          /tmp/litestar-security-wheel/bin/python -I - <<'PY'
          from importlib.resources import files
          from pkgutil import walk_packages
          import importlib
          import sys

          import litestar_security

          for module in walk_packages(litestar_security.__path__, "litestar_security."):
              if not any(part.startswith("_") for part in module.name.split(".")):
                  importlib.import_module(module.name)

          assert litestar_security.__version__ == "0.1.0"
          assert files("litestar_security").joinpath("py.typed").is_file()
          assert "pytest" not in sys.modules
          PY
          /tmp/litestar-security-wheel/bin/litestar security --version

      - name: Upload coverage artifact
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
