default_language_version:
  python: "3"

repos:
  - repo: local
    hooks:
      - id: no-future-annotations
        name: Disallow future annotations in package code
        entry: python tools/hooks/no_future_annotations.py
        language: python
        files: ^src/litestar_security/.*\.py$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the locked ruff. A hook on a different release enables a
    # different set of rules, so the gate and `uv run ruff` would disagree
    # about the same file.
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/python-formate/flake8-dunder-all
    rev: v0.6.0
    hooks:
      - id: ensure-dunder-all
        args: [--use-tuple]
        exclude: ^(docs|src/tests|tools)/

  - repo: https://github.com/ariebovenberg/slotscheck
    rev: v0.20.1
    hooks:
      - id: slotscheck
        files: ^src/litestar_security/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
