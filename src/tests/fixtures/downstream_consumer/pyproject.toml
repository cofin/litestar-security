[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consumer-backend"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["litestar-security>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/consumer_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
